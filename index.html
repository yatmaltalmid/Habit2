<meta name="apple-mobile-web-app-capable" content="yes">

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loop Habit Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        darkCard: '#1e1e1e',
                        darkBorder: '#2c2c2c',
                        darkText: '#e1e1e1',
                        darkSubtext: '#a0a0a0',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-darkBg text-darkText min-h-screen flex flex-col items-center p-0 sm:p-4">

    <div class="w-full max-w-md bg-darkBg sm:bg-darkCard sm:rounded-2xl sm:shadow-2xl sm:border border-darkBorder flex flex-col min-h-screen sm:min-h-[840px] relative overflow-hidden">
        
        <!-- Top App Bar -->
        <header class="flex items-center justify-between px-4 py-3 bg-darkCard border-b border-darkBorder sticky top-0 z-20">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-arrows-spin text-2xl text-indigo-500 animate-spin-slow"></i>
                <h1 class="text-xl font-bold tracking-wide">Loop הרגלים</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openAddModal()" class="p-2 text-indigo-400 hover:text-indigo-300 transition-colors">
                    <i class="fa-solid fa-plus text-xl"></i>
                </button>
            </div>
        </header>

        <!-- Date Column Headers -->
        <div class="flex items-center px-4 py-2 bg-darkCard/80 border-b border-darkBorder text-xs text-darkSubtext sticky top-[53px] z-10 backdrop-blur-md">
            <div class="flex-1 font-medium">שם ההרגל</div>
            <div class="flex gap-2 text-center" id="dateHeaders">
                <!-- JavaScript will populate 5 days here -->
            </div>
        </div>

        <!-- Habits List Container -->
        <main class="flex-1 p-2 space-y-2 overflow-y-auto pb-20" id="habitsList">
            <!-- Habit Cards Rendered Here -->
        </main>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center text-darkSubtext">
            <i class="fa-solid fa-clipboard-list text-5xl mb-4 text-darkBorder"></i>
            <p class="text-lg font-medium text-darkText">אין הרגלים ברשימה</p>
            <p class="text-sm mt-1">לחץ על '+' למעלה כדי להוסיף הרגל חדש</p>
        </div>

    </div>

    <!-- Modal: Add New Habit -->
    <div id="addModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-darkCard border border-darkBorder rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-darkBorder pb-2">
                <h3 class="text-lg font-bold">הוספת הרגל חדש</h3>
                <button onclick="closeAddModal()" class="text-darkSubtext hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div>
                <label class="block text-xs text-darkSubtext mb-1">שם ההרגל</label>
                <input type="text" id="newHabitName" placeholder="למשל: אימון כושר, קריאה..." 
                       class="w-full bg-darkBg border border-darkBorder rounded-lg px-3 py-2 text-sm text-darkText focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs text-darkSubtext mb-2">בחר צבע</label>
                <div class="flex gap-3 justify-center" id="colorPicker">
                    <button type="button" data-color="#6366f1" class="w-8 h-8 rounded-full bg-indigo-500 ring-2 ring-white scale-110"></button>
                    <button type="button" data-color="#10b981" class="w-8 h-8 rounded-full bg-emerald-500"></button>
                    <button type="button" data-color="#f59e0b" class="w-8 h-8 rounded-full bg-amber-500"></button>
                    <button type="button" data-color="#ec4899" class="w-8 h-8 rounded-full bg-pink-500"></button>
                    <button type="button" data-color="#06b6d4" class="w-8 h-8 rounded-full bg-cyan-500"></button>
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="saveNewHabit()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-semibold transition-colors">שמור</button>
                <button onclick="closeAddModal()" class="flex-1 bg-darkBg border border-darkBorder text-darkSubtext py-2 rounded-lg text-sm font-semibold">ביטול</button>
            </div>
        </div>
    </div>

    <!-- Modal: Habit Stats & Actions -->
    <div id="statsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-darkCard border border-darkBorder rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b border-darkBorder pb-2">
                <h3 class="text-lg font-bold flex items-center gap-2" id="statsTitle">
                    <span>סטטיסטיקה</span>
                </h3>
                <button onclick="closeStatsModal()" class="text-darkSubtext hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-darkBg p-3 rounded-xl border border-darkBorder text-center">
                    <div class="text-xs text-darkSubtext">רצף נוכחי</div>
                    <div class="text-2xl font-bold text-amber-500 mt-1" id="statCurrentStreak">0</div>
                    <div class="text-[10px] text-darkSubtext">ימים</div>
                </div>
                <div class="bg-darkBg p-3 rounded-xl border border-darkBorder text-center">
                    <div class="text-xs text-darkSubtext">שיא רצף</div>
                    <div class="text-2xl font-bold text-indigo-400 mt-1" id="statBestStreak">0</div>
                    <div class="text-[10px] text-darkSubtext">ימים</div>
                </div>
                <div class="bg-darkBg p-3 rounded-xl border border-darkBorder text-center col-span-2">
                    <div class="text-xs text-darkSubtext">ניקוד הרגל (הצלחה)</div>
                    <div class="text-3xl font-extrabold text-emerald-400 mt-1" id="statScore">0%</div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="pt-2 border-t border-darkBorder flex justify-between items-center">
                <button onclick="deleteCurrentHabit()" class="text-red-400 hover:text-red-300 text-sm font-medium flex items-center gap-1">
                    <i class="fa-solid fa-trash-can"></i> מחק הרגל
                </button>
                <button onclick="closeStatsModal()" class="bg-darkBg border border-darkBorder px-4 py-1.5 rounded-lg text-sm text-darkText">סגור</button>
            </div>
        </div>
    </div>

   <!-- App Logic -->
    <script>
        let habits = [];
        let selectedColor = "#6366f1";
        let activeHabitId = null;

        // Days configuration: Display last 5 days
        function getDates() {
            const dates = [];
            for (let i = 4; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                dates.push(d);
            }
            return dates;
        }

        const dates = getDates();

        // Format Date to ISO string YYYY-MM-DD
        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }

        // Initialize App
        window.onload = function() {
            loadData();
            renderHeaders();
            renderHabits();
            setupColorPicker();
        };

        // Data Storage
        function loadData() {
            const stored = localStorage.getItem('loop_pwa_habits');
            if (stored) {
                try {
                    habits = JSON.parse(stored);
                } catch(e) {
                    habits = [];
                }
            }
            if (!habits || habits.length === 0) {
                // Default starter habit
                habits = [
                    {
                        id: Date.now(),
                        name: "שתיית מים (2 ליטר)",
                        color: "#06b6d4",
                        history: {}
                    }
                ];
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('loop_pwa_habits', JSON.stringify(habits));
        }

        // Render Date Headers
        function renderHeaders() {
            const daysShort = ['א\'', 'ב\'', 'ג\'', 'ד\'', 'ה\'', 'ו\'', 'ש\''];
            const container = document.getElementById('dateHeaders');
            container.innerHTML = dates.map(d => `
                <div class="w-8">
                    <div class="font-bold">${daysShort[d.getDay()]}</div>
                    <div class="text-[10px] opacity-70">${d.getDate()}</div>
                </div>
            `).join('');
        }

        // Render Habits List with 3-State Cycle (Done, Skipped, Failed, Empty)
        function renderHabits() {
            const container = document.getElementById('habitsList');
            const emptyState = document.getElementById('emptyState');

            if (habits.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = habits.map(habit => {
                const checkBubbles = dates.map(d => {
                    const dateStr = formatDate(d);
                    const status = habit.history[dateStr] || 'none'; // 'done', 'skipped', 'failed', or 'none'
                    
                    let bgStyle = 'transparent';
                    let borderStyle = '#333';
                    let icon = '';

                    if (status === 'done') {
                        bgStyle = habit.color;
                        borderStyle = habit.color;
                        icon = '<i class="fa-solid fa-check text-white text-xs"></i>';
                    } else if (status === 'skipped') {
                        bgStyle = 'rgba(245, 158, 11, 0.2)'; // amber/orange tint
                        borderStyle = '#f59e0b';
                        icon = '<i class="fa-solid fa-minus text-amber-500 text-xs"></i>';
                    } else if (status === 'failed') {
                        bgStyle = 'rgba(239, 68, 68, 0.2)'; // red tint
                        borderStyle = '#ef4444';
                        icon = '<i class="fa-solid fa-xmark text-red-500 text-xs"></i>';
                    }
                    
                    return `
                        <button onclick="toggleHabit('${habit.id}', '${dateStr}')" 
                                class="w-8 h-8 rounded-full flex items-center justify-center transition-all duration-200"
                                style="background-color: ${bgStyle}; border: 2px solid ${borderStyle}">
                            ${icon}
                        </button>
                    `;
                }).join('');

                return `
                    <div class="bg-darkCard border border-darkBorder rounded-xl p-3 flex items-center justify-between shadow-sm hover:border-darkSubtext/40 transition-colors">
                        <div onclick="openStatsModal(${habit.id})" class="flex items-center gap-3 cursor-pointer flex-1 min-w-0 pr-1">
                            <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${habit.color}"></span>
                            <span class="font-medium text-sm text-darkText truncate">${habit.name}</span>
                        </div>
                        <div class="flex gap-2">
                            ${checkBubbles}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Cycle through status: none -> done (וי) -> skipped (מינוס) -> failed (איקס) -> none
        function toggleHabit(habitId, dateStr) {
            const habit = habits.find(h => h.id == habitId);
            if (habit) {
                const currentStatus = habit.history[dateStr] || 'none';
                
                // Compatibility layer for old boolean values
                let nextStatus = 'done';
                if (currentStatus === true || currentStatus === 'done') nextStatus = 'skipped';
                else if (currentStatus === 'skipped') nextStatus = 'failed';
                else if (currentStatus === 'failed') nextStatus = 'none';
                else nextStatus = 'done';

                if (nextStatus === 'none') {
                    delete habit.history[dateStr];
                } else {
                    habit.history[dateStr] = nextStatus;
                }
                
                saveData();
                renderHabits();
            }
        }

        // Modal Controls
        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('newHabitName').focus();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
            document.getElementById('newHabitName').value = '';
        }

        function setupColorPicker() {
            const buttons = document.querySelectorAll('#colorPicker button');
            buttons.forEach(btn => {
                btn.onclick = (e) => {
                    buttons.forEach(b => b.classList.remove('ring-2', 'ring-white', 'scale-110'));
                    btn.classList.add('ring-2', 'ring-white', 'scale-110');
                    selectedColor = btn.getAttribute('data-color');
                };
            });
        }

        function saveNewHabit() {
            const nameInput = document.getElementById('newHabitName');
            const name = nameInput.value.trim();
            if (!name) return;

            habits.push({
                id: Date.now(),
                name: name,
                color: selectedColor,
                history: {}
            });

            saveData();
            renderHabits();
            closeAddModal();
        }

        // Statistics Modal Logic
        function openStatsModal(habitId) {
            activeHabitId = habitId;
            const habit = habits.find(h => h.id == habitId);
            if (!habit) return;

            document.getElementById('statsTitle').innerHTML = `
                <span class="w-3 h-3 rounded-full" style="background-color: ${habit.color}"></span>
                <span>${habit.name}</span>
            `;

            const stats = calculateStats(habit);
            document.getElementById('statCurrentStreak').innerText = stats.currentStreak;
            document.getElementById('statBestStreak').innerText = stats.bestStreak;
            document.getElementById('statScore').innerText = `${stats.score}%`;

            document.getElementById('statsModal').classList.remove('hidden');
        }

        function closeStatsModal() {
            document.getElementById('statsModal').classList.add('hidden');
            activeHabitId = null;
        }

        function deleteCurrentHabit() {
            if (!activeHabitId) return;
            habits = habits.filter(h => h.id != activeHabitId);
            saveData();
            renderHabits();
            closeStatsModal();
        }

        // Calculations (Streaks & Completion Rate considering skipped/failed)
        function calculateStats(habit) {
            const history = habit.history || {};
            let currentStreak = 0;
            let bestStreak = 0;
            let tempStreak = 0;

            const today = new Date();
            let totalChecked = 0;

            for (let i = 0; i < 30; i++) {
                const d = new Date();
                d.setDate(today.getDate() - i);
                const dateStr = formatDate(d);
                const status = history[dateStr];

                if (status === 'done' || status === true) {
                    totalChecked++;
                    tempStreak++;
                    if (i === 0 || currentStreak === i) {
                        currentStreak = tempStreak;
                    }
                    if (tempStreak > bestStreak) {
                        bestStreak = tempStreak;
                    }
                } else if (status === 'skipped') {
                    // Skipped maintains streak without breaking it
                } else {
                    tempStreak = 0;
                }
            }

            const score = Math.round((totalChecked / 30) * 100);

            return {
                currentStreak,
                bestStreak,
                score
            };
        }
    </script>
</body>
</html>
